name: Code Safety

on:
  push:
  pull_request:
    branches:
      main

jobs:
  check-linter:
    runs-on: ubuntu-latest
    steps:

uses: actions/checkout@v4
uses: astral-sh/setup-uv@v5
run: uv sync --frozen --python 3.13
run: uv run --no-sync python -m ruff check .

  check-formatter:
    runs-on: ubuntu-latest
    steps:

uses: actions/checkout@v4
uses: astral-sh/setup-uv@v5
run: uv sync --frozen --python 3.13
run: uv run --no-sync python -m ruff format --check .

  check-type-safety:
    runs-on: ubuntu-latest
    steps:

uses: actions/checkout@v4
uses: astral-sh/setup-uv@v5
run: uv sync --frozen --python 3.13
run: uv run --no-sync python -m pyright

  run-unit-tests:
    runs-on: ubuntu-latest
    steps:

uses: actions/checkout@v4
uses: astral-sh/setup-uv@v5
run: uv sync --frozen --python 3.13
run: uv run --no-sync python -m pytest -q